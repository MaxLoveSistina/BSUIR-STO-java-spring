
name: Java CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Получение исходного кода
      - name: Checkout
        uses: actions/checkout@v4

      # Установка Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Сборка проекта и запуск тестов
      - name: Build and Test
        working-directory: backend
        run: mvn clean test
